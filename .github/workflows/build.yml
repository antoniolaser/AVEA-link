name: Crea APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scompatta SOLO lo zip con il numero di versione piu' alto: se nel repository
      # ce ne sono piu' d'uno, gli altri vengono ignorati.
      - name: Scompatta il progetto
        run: |
          Z=$(find . -path ./.git -prune -o -iname '*.zip' -print | sort -V | tail -1)
          if [ -n "$Z" ]; then
            echo "Uso solo lo zip piu' recente: $Z"
            unzip -o -q "$Z" -d "_zip"
          fi
          if [ ! -f settings.gradle ]; then
            S=$(find . -path ./.git -prune -o -name settings.gradle -print | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
            if [ -n "$S" ]; then D=$(dirname "$S"); echo "Progetto trovato in: $D"; cp -r "$D"/. . ; fi
          elif [ -d _zip ]; then
            S=$(find _zip -name settings.gradle | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
            if [ -n "$S" ]; then cp -r "$(dirname "$S")"/. . ; fi
          fi
          echo "File del progetto:"; ls -la
          if [ ! -f settings.gradle ]; then echo "::error::Nel repository non c'e' il progetto: carica lo zip nella pagina principale"; exit 1; fi

      # Scritto nel log: cosi' si vede subito se e' stato preso lo zip giusto.
      - name: Versione che sto compilando
        run: grep -E "versionName|versionCode" app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Nessuna chiave di firma: si compila la variante debug, che Gradle firma da se'.
      # L'APK si installa, ma la chiave cambia a ogni compilazione: per aggiornare
      # bisogna disinstallare prima la versione precedente.
      - name: Compila l'APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rinomina
        run: |
          A=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK trovato: $A"
          cp "$A" AVEA-Link.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AVEA-Link-apk
          path: AVEA-Link.apk

      # Ultimo APK sempre nella pagina "Releases": si scarica dal telefono.
      - name: Pubblica in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" AVEA-Link.apk --title "AVEA Link ${{ github.run_number }}" --notes "APK firmato in debug. Per aggiornare, disinstallare prima la versione precedente." --latest
